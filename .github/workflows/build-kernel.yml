name: build-kernel

# Build the kernel from *this repository's* branch.
#
# Why not a plain `repo sync`: the manifest's root project is
# OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8850 and
# kernel_platform/common is pinned to AOSP kernel/common @ android16-6.12.89_r00.
# A full `repo sync` therefore materialises a *pristine* ACK tree and ignores the
# patches this fork carries (KernelSU, SUSFS, the PLK110 defconfig/cert and the
# kleaf fixes). Measured 2026-11-21: the synced constants.bzl still had
# vmlinux_oki and the tree had no drivers/kernelsu.
#
# So: clone the branch under test, then use `repo` only to fetch the eight
# kernel_platform/prebuilts/* projects that the manifest pins, and build in place.
#
# Runners
#   self-hosted (label op15) : fast, keeps prebuilts + bazel cache between runs
#   ubuntu-latest            : 4 vCPU / 16 GB. Measured /dev/root 145G with 85G
#                              free before cleanup; the cleanup step frees ~30-40G
#                              more. ~100 GB usable is plenty; expect 40-70 min.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "branch to build"
        type: choice
        default: plk110-17.0.1.201-kernelsu
        options:
          - plk110-17.0.1.201-full          # KernelSU + SUSFS + Droidspaces
          - plk110-17.0.1.201-droidspaces   # Droidspaces only (KernelSU off)
          - plk110-17.0.1.201-kernelsu      # KernelSU + SUSFS only
      target:
        description: "what to build"
        type: choice
        default: kernel
        options:
          - kernel
          - kernel+boot
      jobs:
        description: "bazel --jobs"
        default: "4"
      kernel_base:
        description: "kernel source base"
        type: choice
        default: fork
        options:
          - fork            # this repository's tree (ACK 6.12.117 + oneplus/KSU/SUSFS)
          - ack-6.12.69     # stock base: AOSP kernel/common @ 5fd39602326e
      runner:
        description: "build machine"
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-latest

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

env:
  PREBUILTS: >-
    kernel_platform/prebuilts/clang/host/linux-x86
    kernel_platform/prebuilts/clang-tools
    kernel_platform/prebuilts/build-tools
    kernel_platform/prebuilts/kernel-build-tools
    kernel_platform/prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8
    kernel_platform/prebuilts/jdk/jdk11
    kernel_platform/prebuilts/ndk-r26
    kernel_platform/prebuilts/rust

jobs:
  build:
    runs-on: ${{ inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || 'op15' }}
    timeout-minutes: 300
    env:
      VARIANT: ${{ inputs.variant }}
      TARGET: ${{ inputs.target }}
      JOBS: ${{ inputs.jobs }}
      WORK: ${{ github.workspace }}/work
      SRC: ${{ github.workspace }}/work/src
    steps:
      - name: Check out tooling (contract oracle)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: tooling

      - name: Free disk space (hosted runners)
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        run: |
          set -euo pipefail
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/az /usr/share/swift || true
          sudo docker image prune -af || true
          sudo apt-get -y purge '^dotnet-.*' '^llvm-.*' '^mysql-.*' '^ruby-.*' 2>/dev/null || true
          sudo apt-get -y autoremove --purge 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "after:"; df -h / | tail -1

      - name: Install repo tool
        run: |
          set -euo pipefail
          if ! command -v repo >/dev/null; then
            mkdir -p "$HOME/bin"
            curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
            chmod +x "$HOME/bin/repo"
            echo "$HOME/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/bin:$PATH"
          fi
          repo --version | head -1

      - name: Preflight
        run: |
          set -euo pipefail
          echo "variant=$VARIANT target=$TARGET jobs=$JOBS runner=${{ inputs.runner }}"
          free -h || true
          df -h "$RUNNER_WORKSPACE" || true
          avail=$(df -BG --output=avail "$RUNNER_WORKSPACE" | tail -1 | tr -dc '0-9')
          need=45; [ "${{ inputs.runner }}" = "self-hosted" ] && need=80
          if [ "${avail:-0}" -lt "$need" ]; then
            echo "::error::need >= ${need} GB free, have ${avail} GB"; exit 1
          fi
          command -v repo >/dev/null || { echo "::error::repo missing"; exit 1; }

      - name: Clone the branch under test
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cd "$WORK"
          if [ ! -d src/.git ]; then
            git clone --depth 1 --branch "$VARIANT" \
              "${{ github.server_url }}/${{ github.repository }}.git" src
          fi
          cd src
          echo "HEAD $(git rev-parse --short HEAD) on $(git rev-parse --abbrev-ref HEAD)"

      - name: Fetch the pinned prebuilts only
        run: |
          set -euo pipefail
          cd "$SRC"
          if [ ! -d .repo ]; then
            repo init -u "${{ github.server_url }}/${{ github.repository }}" \
                      -b "$VARIANT" -m oneplus_15.xml --depth=1
          fi
          # shellcheck disable=SC2086
          repo sync -c --no-clone-bundle -j8 $PREBUILTS

      - name: Swap in the stock 6.12.69 ACK base
        if: ${{ inputs.kernel_base == 'ack-6.12.69' }}
        run: |
          set -euo pipefail
          cd "$SRC/kernel_platform"
          cert=$(ls common/certs/plk110_*_stock_gki_module_signing.pem)
          rm -rf common
          ack=$(mktemp -d)
          git clone --filter=blob:none --no-checkout --quiet \
            https://android.googlesource.com/kernel/common "$ack"
          git -C "$ack" fetch --quiet --depth=1 origin 5fd39602326e
          git -C "$ack" checkout -q FETCH_HEAD
          mkdir -p common
          rsync -a --exclude='.git' "$ack/" common/
          cp "$cert" "common/$cert"
          cfg=common/arch/arm64/configs/gki_defconfig
          if grep -q '^CONFIG_SYSTEM_TRUSTED_KEYS=' "$cfg"; then
            sed -i "s|^CONFIG_SYSTEM_TRUSTED_KEYS=.*|CONFIG_SYSTEM_TRUSTED_KEYS=\"${cert#common/}\"|" "$cfg"
          else
            echo "CONFIG_SYSTEM_TRUSTED_KEYS=\"${cert#common/}\"" >> "$cfg"
          fi
          echo "ack base: $(git -C "$ack" rev-parse HEAD)"
          ls common | head -5

      - name: Verify tree is the one under test
        run: |
          set -euo pipefail
          cd "$SRC"
          # our patches must be present, otherwise the manifest tree was used
          if [ "${{ inputs.kernel_base }}" = "ack-6.12.69" ]; then
            grep -q "KernelSU" kernel_platform/common/drivers/Kconfig \
              && { echo "::error::ACK base still has KernelSU?"; exit 1; } || true
          else
            test -d kernel_platform/common/drivers/kernelsu \
              || { echo "::error::drivers/kernelsu missing - this is not the fork tree"; exit 1; }
            grep -q "KSU_VERSION" kernel_platform/common/drivers/kernelsu/Kbuild \
              || { echo "::error::KernelSU pin missing"; exit 1; }
          fi
          grep -q "plk110_17_0_1_201_stock_gki_module_signing" \
            kernel_platform/common/arch/arm64/configs/gki_defconfig \
            || { echo "::error::PLK110 trust anchor missing"; exit 1; }
          for p in $PREBUILTS; do
            test -d "$p" || { echo "::error::missing prebuilt $p"; exit 1; }
          done
          echo "tree OK: $(git rev-parse --short HEAD)"

      - name: Set up Python 3.13 (prebuilt avbtool bytecode)
        if: ${{ inputs.target == 'kernel+boot' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Show effective kleaf output list
        run: |
          set -euo pipefail
          cd "$SRC"
          grep -rn "vmlinux_oki" kernel_platform/build/kernel/kleaf/constants.bzl \
                kernel_platform/common/BUILD.bazel || echo "vmlinux_oki: none (ok)"
          sed -n '/_common_outs = \[/,/\]/p' kernel_platform/build/kernel/kleaf/constants.bzl

      - name: Build kernel
        run: |
          set -euo pipefail
          cd "$SRC/kernel_platform"
          tools/bazel --output_user_root="$WORK/out/bazel" build \
            --jobs="$JOBS" --config=local \
            --cache_dir="$WORK/out/kbuild-cache" \
            --kbuild_symtypes --show_progress_rate_limit=15 --verbose_failures \
            --//build/kernel/kleaf:user_ddk_unsafe_headers=//build/kernel/kleaf/impl:empty_filegroup \
            //common:kernel_aarch64 \
            //common:kernel_aarch64_abi_dump \
            //common:kernel_aarch64_abi_kmi_symbol_checks

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd "$SRC/kernel_platform"
          image=$(find -L bazel-bin/common -name Image -type f | head -1)
          symvers=$(find -L bazel-bin/common -name Module.symvers -type f | head -1)
          test -n "$image" || { echo "::error::Image not produced"; exit 1; }
          cp "$image" "$GITHUB_WORKSPACE/artifacts/Image"
          [ -n "$symvers" ] && cp "$symvers" "$GITHUB_WORKSPACE/artifacts/Module.symvers" || true
          boot=$(find -L bazel-bin/soc-repo -name boot.img -type f 2>/dev/null | head -1 || true)
          if [ -n "${boot:-}" ]; then
            cp "$boot" "$GITHUB_WORKSPACE/artifacts/boot.img"
            sz=$(stat -c%s "$GITHUB_WORKSPACE/artifacts/boot.img")
            echo "boot.img bytes: $sz"
            test "$sz" -eq 100663296 || { echo "::error::boot.img must be 100663296 bytes"; exit 1; }
          fi
          ( cd "$GITHUB_WORKSPACE/artifacts" && sha256sum * | tee SHA256SUMS )

      - name: Package AVB boot image (stock container contract)
        if: ${{ inputs.target == 'kernel+boot' }}
        env:
          AVB_FINGERPRINT: qti/canoe/canoe:16/BP2A.250605.015/1793215886442:user/release-keys
          AVB_SECURITY_PATCH: "2026-11-01"
          BOOT_PARTITION_SIZE: "100663296"
        run: |
          set -euo pipefail
          cd "$SRC/kernel_platform"
          art="$GITHUB_WORKSPACE/artifacts"
          avbtool=$(find prebuilts/kernel-build-tools -name avbtool -type f | head -1)
          test -n "${avbtool:-}" || { echo "::error::avbtool not in prebuilts"; exit 1; }
          # the prebuilt is precompiled bytecode; pick an interpreter whose
          # magic matches instead of blindly calling `python3 <file>`
          AVB=""
          for cand in "python3.13 $avbtool" "$avbtool" "python3.12 $avbtool" "python3 $avbtool"; do
            if $cand version >/dev/null 2>&1; then AVB="$cand"; break; fi
          done
          test -n "$AVB" || { echo "::error::cannot execute avbtool ($avbtool)"; file "$avbtool"; exit 1; }
          echo "avbtool: $AVB -> $($AVB version)"
          key=tools/mkbootimg/gki/testdata/testkey_rsa4096.pem
          test -f "$key" || { echo "::error::test AVB key missing"; exit 1; }

          # stock container: header v4, 4096 page, empty cmdline, no ramdisk,
          # os_version/os_patch_level fields zero (stock boot.img has 0 there)
          python3 tools/mkbootimg/mkbootimg.py \
            --header_version 4 --pagesize 4096 \
            --kernel "$art/Image" \
            --output "$art/boot-unsigned.img"

          # add_hash_footer patches the image in place; --output would emit only
          # the vbmeta structure (2368 bytes) instead of the padded boot image
          cp "$art/boot-unsigned.img" "$art/boot.img"
          $AVB add_hash_footer \
            --image "$art/boot.img" \
            --partition_size "$BOOT_PARTITION_SIZE" --partition_name boot \
            --algorithm SHA256_RSA4096 --key "$key" \
            --prop com.android.build.boot.os_version:16 \
            --prop "com.android.build.boot.fingerprint:$AVB_FINGERPRINT" \
            --prop "com.android.build.boot.security_patch:$AVB_SECURITY_PATCH"
          rm -f "$art/boot-unsigned.img"

          # structural checks on the container itself
          python3 - "$art/boot.img" "$BOOT_PARTITION_SIZE" <<'PYEOF'
          import struct, sys
          path, size = sys.argv[1], int(sys.argv[2])
          d = open(path, 'rb').read()
          assert len(d) == size, f"boot.img {len(d)} != {size}"
          assert d[:8] == b'ANDROID!', 'bad boot magic'
          assert struct.unpack_from('<I', d, 40)[0] == 4, 'header version != 4'
          assert struct.unpack_from('<I', d, 20)[0] == 1584, 'header_size != 1584'
          assert struct.unpack_from('<I', d, 16)[0] == 0, 'os_version field != 0'
          assert struct.unpack_from('<I', d, 12)[0] == 0, 'ramdisk must be empty'
          assert d[44:44+512].split(b'\0')[0] == b'', 'cmdline must be empty'
          assert d[-64:][:4] == b'AVBf', 'missing avb footer'
          print(f'container OK: {len(d)} bytes, header v4, kernel {struct.unpack_from("<I", d, 8)[0]}')
          PYEOF

          # AVB properties come from avbtool itself (no hand-rolled vbmeta parsing)
          # info_image indents every line; do not anchor the grep (pipefail would
          # turn "no match" into a silent early exit) and always dump the file
          $AVB info_image --image "$art/boot.img" > "$art/avb-info.txt"
          grep -E "Prop:" "$art/avb-info.txt" || echo "(no Prop lines?)"
          for kv in \
            "com.android.build.boot.os_version:16" \
            "com.android.build.boot.fingerprint:$AVB_FINGERPRINT" \
            "com.android.build.boot.security_patch:$AVB_SECURITY_PATCH"; do
            key=${kv%%:*}; val=${kv#*:}
            line=$(grep -F "Prop: $key" "$art/avb-info.txt" | head -1 || true)
            # match the value inside the line so quoting/arrow style does not matter
            [ -n "$line" ] && printf '%s' "$line" | grep -Fq "$val" \
              || { echo "::error::AVB prop mismatch for $key"; \
                   echo "  want value: $val"; echo "  got line  : ${line:-<none>}"; \
                   grep -E "Prop:" "$art/avb-info.txt" || true; exit 1; }
          done
          echo "AVB props OK"

          # prove the signature itself verifies with the key we signed with
          $AVB extract_public_key --key "$key" --output "$art/public.avbpubkey" >/dev/null
          $AVB verify_image --image "$art/boot.img" --key "$art/public.avbpubkey"
          ( cd "$art" && sha256sum boot.img | tee -a SHA256SUMS )

      - name: Contract gate (4,267 symbols of PLK110 17.0.1.201)
        run: |
          set -euo pipefail
          python3 tooling/tools/plk110/verify_image.py \
            "$GITHUB_WORKSPACE/artifacts/Image" \
            tooling/tools/plk110/stock_module_oracle.json | tee gate.txt
          grep -q "VERDICT: PASS" gate.txt || { echo "::error::stock module contract FAILED"; exit 1; }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.variant }}-${{ github.run_number }}
          path: |
            artifacts/Image
            artifacts/Module.symvers
            artifacts/boot.img
            artifacts/SHA256SUMS
            gate.txt
          if-no-files-found: warn
          retention-days: 14
