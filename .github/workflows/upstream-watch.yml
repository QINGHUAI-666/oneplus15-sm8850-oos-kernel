name: upstream-watch

# Daily drift detection for the two vendored third-party features.
#
#   KernelSU : tiann/KernelSU          (vendored source tree)
#   SUSFS    : simonpunk/susfs4ksu     (kernel patch series + KernelSU patch)
#
# When upstream moves, the sync tools are run on a scratch branch:
#   * both clean  -> branch is pushed and a PR is opened for review
#   * any conflict-> the PR is skipped and an issue is opened with the report
# Nothing is ever pushed to main directly.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "run the sync even when pins are current"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect drift
        id: drift
        run: |
          set +e
          python3 tools/upstream/upstream.py check --json drift.json
          rc=$?
          set -e
          echo "rc=$rc"
          cat drift.json || true
          if [ "$rc" -eq 1 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::upstream check failed"
            exit 1
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Upstream status"
            echo '```'
            python3 tools/upstream/upstream.py check || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read sync policy
        id: policy
        run: |
          auto=$(python3 -c "import json;print(str(json.load(open('tools/upstream/pins.json')).get('policy',{}).get('auto_sync', False)).lower())")
          reason=$(python3 -c "import json;print(json.load(open('tools/upstream/pins.json')).get('policy',{}).get('reason',''))")
          echo "auto_sync=$auto" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "policy auto_sync=$auto"
          [ -n "$reason" ] && echo "reason: $reason"
          {
            echo "### Sync policy"
            echo "- auto_sync: \`$auto\`"
            [ -n "$reason" ] && echo "- $reason"
          } >> "$GITHUB_STEP_SUMMARY"
          # pair status is informational and cheap; always report it
          python3 tools/upstream/upstream.py compat || true

      - name: Sync KernelSU
        if: (steps.drift.outputs.drift == 'true' || inputs.force_sync) && (steps.policy.outputs.auto_sync == 'true' || inputs.force_sync)
        id: ksu
        continue-on-error: true
        run: python3 tools/upstream/upstream.py sync-kernelsu | tee ksu.log

      - name: Sync SUSFS
        if: (steps.drift.outputs.drift == 'true' || inputs.force_sync) && (steps.policy.outputs.auto_sync == 'true' || inputs.force_sync)
        id: susfs
        continue-on-error: true
        run: python3 tools/upstream/upstream.py sync-susfs | tee susfs.log

      - name: Remove volatile caches from the commit
        run: rm -rf tools/upstream/cache

      - name: Summarise
        id: summary
        run: |
          set -euo pipefail
          {
            echo "## Upstream sync $(date -u +%F)"
            echo
            echo "* KernelSU step: ${{ steps.ksu.outcome }}"
            echo "* SUSFS step:    ${{ steps.susfs.outcome }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create branch, commit and open PR
        if: steps.ksu.outcome == 'success' && steps.susfs.outcome == 'success' && (steps.drift.outputs.drift == 'true' || inputs.force_sync) && (steps.policy.outputs.auto_sync == 'true' || inputs.force_sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="chore/upstream-sync-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A tools/upstream kernel_platform/common/drivers/kernelsu \
                     kernel_platform/common/include/linux kernel_platform/common/fs
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          ksu_pin=$(python3 -c "import json;p=json.load(open('tools/upstream/pins.json'));print(p['kernelsu']['ref'][:12], p['kernelsu']['version'])")
          susfs_pin=$(python3 -c "import json;p=json.load(open('tools/upstream/pins.json'));print(p['susfs']['ref'][:12], p['susfs']['version'])")
          printf '%s\n' \
            "chore(upstream): sync KernelSU and SUSFS pins" \
            "" \
            "KernelSU: ${ksu_pin}" \
            "SUSFS:    ${susfs_pin}" \
            "" \
            "Generated by .github/workflows/upstream-watch.yml. Review the patch" \
            "series before merging: SUSFS tunes kernel internals and must keep the" \
            "4,267-symbol stock module contract intact (run" \
            "tools/plk110/verify_image.py after a build)." > /tmp/commit-msg
          git commit -F /tmp/commit-msg
          git push -u origin "$branch"
          gh pr create --draft --title "chore(upstream): KernelSU/SUSFS sync $(date -u +%F)" \
            --body "Automated upstream sync. Pins updated in tools/upstream/pins.json. Review the diff and run the build workflow on this branch before merging." \
            || echo "::warning::PR creation failed (branch still pushed)"

      - name: Open issue when the sync needs a human
        if: (steps.ksu.outcome == 'failure' || steps.susfs.outcome == 'failure') && (steps.policy.outputs.auto_sync == 'true' || inputs.force_sync)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(
            echo "Automated upstream sync could not be applied cleanly."
            echo
            echo "| step | result |"
            echo "|---|---|"
            echo "| KernelSU | ${{ steps.ksu.outcome }} |"
            echo "| SUSFS | ${{ steps.susfs.outcome }} |"
            echo
            if [ -f tools/upstream/report.md ]; then
              echo "<details><summary>conflict report</summary>"
              echo
              head -400 tools/upstream/report.md
              echo
              echo "</details>"
            fi
            echo
            echo "Upstream heads:"
            echo '```'
            python3 tools/upstream/upstream.py check || true
            echo '```'
          )
          gh issue create --title "upstream: manual port needed ($(date -u +%F))" --body "$body" \
            || echo "::warning::issue creation failed"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-watch-${{ github.run_number }}
          path: |
            ksu.log
            susfs.log
            drift.json
            tools/upstream/report.md
          if-no-files-found: ignore
          retention-days: 30
